<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mock OA Login</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 360px; margin: 60px auto; padding: 0 16px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  input.el-input__inner { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .captcha-row { display: flex; gap: 8px; align-items: center; }
  div.captcha { cursor: pointer; user-select: none; }
  div.captcha img { height: 38px; display: block; }
</style>
</head>
<body>
  <h3>Mock OA Login (for end-to-end test)</h3>
  <form class="login-form" onsubmit="return false">
    <input class="el-input__inner" name="account" placeholder="请输入用户名" value="alice" />
    <input class="el-input__inner" type="password" name="password" placeholder="请输入密码" value="pw" />
    <div class="captcha-row">
      <input class="el-input__inner" placeholder="验证码" />
      <div class="captcha"><img id="cap" src="/captcha-A8K3.png" alt="captcha" /></div>
    </div>
    <button type="submit">登录</button>
  </form>
</body>
</html>
